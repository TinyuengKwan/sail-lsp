# Spelling policy for maintained source; vendored sources keep upstream bytes.
[files]
extend-exclude = [
    ".git/",
    "crates/syntax/src/ast/generated/",
    "crates/*/src/tests/",
    "crates/sail-lsp/data/sail-lib/",
    "lib/",
    "*.rast",
]

[default]
extend-ignore-re = [
    # Cursor fixtures and generated/truncated labels.
    ".*\\$0.*",
    "\\w*\\.{3,4}\\w*",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[default.extend-words]
# Sail keywords, builtin spellings and upstream diagnostic wording.
iff = "iff"
nexp = "nexp"
typ = "typ"
typs = "typs"
inout = "inout"
bitvec = "bitvec"
bitv = "bitv"
shl = "shl"
shr = "shr"
lsl = "lsl"
lsr = "lsr"
asr = "asr"
preceed = "preceed"
concatentation = "concatentation"
implicits = "implicits"
# PowerShell's case-insensitive inequality operator (-ine).
ine = "ine"
# Literal collections and interval lower-bound identifiers.
lits = "lits"
alo = "alo"
# Intentional partial identifiers and truncated labels in editor tests.
hel = "hel"
secon = "secon"
unparseable = "unparseable"
# Fixture vocabulary retained from the former _typos.toml.
ba = "ba"
fo = "fo"
jod = "jod"
pn = "pn"

[default.extend-identifiers]
NTO = "NTO"
# Intentional unknown formatter key in configuration-error fixtures.
line_wdth = "line_wdth"
