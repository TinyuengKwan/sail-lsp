# CI workflow for sail-lsp.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Z3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3
          sail_z3_prefix=$(brew --prefix z3)
          echo "Z3_LIBRARY_PATH_OVERRIDE=$sail_z3_prefix/lib" >> "$GITHUB_ENV"
          echo "SAIL_LSP_Z3_CACHE_KEY=system-$(z3 --version)" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Cached z3-sys build output contains versioned Homebrew library paths.
          key: ${{ env.SAIL_LSP_Z3_CACHE_KEY }}

      - name: Set MSVC encoding flags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CFLAGS=/utf-8" >> $env:GITHUB_ENV
          echo "CXXFLAGS=/utf-8" >> $env:GITHUB_ENV

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Codegen check
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p syntax -- codegen

      - name: Test (default features, z3-solver enabled)
        if: runner.os != 'Windows'
        run: cargo nextest run --workspace --no-fail-fast --hide-progress-bar --status-level fail

      - name: Test (default features, z3-solver vendored, Windows)
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --features vendored --no-fail-fast --hide-progress-bar --status-level fail

      - name: Test (no z3-solver)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --workspace --no-default-features --no-fail-fast --hide-progress-bar --status-level fail

      - name: Build release binary
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p sail-lsp

  rustfmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- \
            -D clippy::dbg_macro \
            -D clippy::todo \
            -D clippy::print_stdout \
            -D clippy::print_stderr

  vscode:
    name: VS Code Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: editors/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Z3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3
          sail_z3_prefix=$(brew --prefix z3)
          echo "Z3_LIBRARY_PATH_OVERRIDE=$sail_z3_prefix/lib" >> "$GITHUB_ENV"
          echo "SAIL_LSP_Z3_CACHE_KEY=system-$(z3 --version)" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.SAIL_LSP_Z3_CACHE_KEY }}

      - name: Build extension-host test server
        if: runner.os != 'Windows'
        run: cargo build -p sail-lsp
        working-directory: ${{ github.workspace }}

      - name: Build extension-host test server (Windows)
        if: runner.os == 'Windows'
        env:
          CFLAGS: /utf-8
          CXXFLAGS: /utf-8
        run: cargo build -p sail-lsp --features vendored
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Project graph and analysis explanation tests
        run: npm run test:graph

      - name: Format check
        run: npm run format:check

      - name: Build (production)
        run: npm run vscode:prepublish

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Run extension smoke tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run extension smoke tests (native desktop)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package extension
        run: npx @vscode/vsce package -o sail-lsp.vsix --allow-missing-repository

  distribution:
    name: Standalone and editor installation
    uses: ./.github/workflows/install.yaml
    permissions:
      contents: read

  performance:
    name: Editor performance regression
    uses: ./.github/workflows/performance.yaml
    permissions:
      contents: read

  corpus:
    name: Pinned upstream and editor corpus
    uses: ./.github/workflows/corpus.yml
    permissions:
      contents: read

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for typos
        uses: crate-ci/typos@v1.46.3

  conclusion:
    name: Conclusion
    if: always()
    needs: [rust, rustfmt, clippy, vscode, distribution, performance, corpus, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
