name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
      create_release:
        description: Create or update a GitHub release
        required: false
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub release as prerelease
        required: false
        type: boolean
        default: false
      publish_marketplace:
        description: Publish VSIX packages to VS Code Marketplace
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            server_script: package:server:linux-x64
            vsix_script: package:vsix:linux-x64
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            server_script: package:server:win32-x64
            vsix_script: package:vsix:win32-x64
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
            server_script: package:server:darwin-arm64
            vsix_script: package:vsix:darwin-arm64
    defaults:
      run:
        working-directory: editors/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build release server binary
        run: cargo build --release -p sail-lsp --target ${{ matrix.rust_target }} --target-dir target/vscode/${{ matrix.target }}
        working-directory: ${{ github.workspace }}

      - name: Bundle server binary
        run: npm run ${{ matrix.server_script }}

      - name: Package VSIX
        run: npm run ${{ matrix.vsix_script }} -- --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sail-lsp-${{ matrix.target }}
          path: editors/code/*.vsix

  marketplace:
    name: Publish Marketplace (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: bundle
    if: (github.event_name == 'push' || inputs.publish_marketplace) && secrets.VSCE_PAT != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            package: sail-lsp-linux-x64.vsix
          - target: win32-x64
            package: sail-lsp-win32-x64.vsix
          - target: darwin-arm64
            package: sail-lsp-darwin-arm64.vsix
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: editors/code

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: editors/code
          pattern: sail-lsp-*
          merge-multiple: true

      - name: Publish ${{ matrix.package }} to Marketplace
        run: npx @vscode/vsce publish --packagePath ${{ matrix.package }}
        working-directory: editors/code
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - bundle
      - marketplace
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.create_release)
    steps:
      - name: Check upstream job results
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.NEEDS_JSON);
            const failed = Object.entries(results)
              .filter(([, value]) => value.result !== 'success' && value.result !== 'skipped');
            if (failed.length > 0) {
              core.setFailed(`dependent jobs failed: ${failed.map(([name, value]) => `${name}=${value.result}`).join(', ')}`);
            }

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sail-lsp-*
          merge-multiple: true

      - name: Compute release tag
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.eventName === 'push'
              ? context.ref.replace('refs/tags/', '')
              : `v${new Date().toISOString().slice(0, 10)}-${context.runNumber}`;
            core.setOutput('tag', tag);
            core.setOutput('name', `VS Code Extension ${tag}`);

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*.vsix
