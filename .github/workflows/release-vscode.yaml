# Compatibility/manual entry point. Standalone archives and VSIX now use one
# build, one platform matrix and one GitHub Release. Marketplace is optional.
name: Release VS Code Extension
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        default: main
        type: string
      version:
        description: Version tag matching Cargo.toml and package.json
        required: true
        type: string
      create_release:
        description: Publish a GitHub Release
        default: true
        type: boolean
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean
      publish_marketplace:
        description: Also publish to Marketplace
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  distribute:
    uses: ./.github/workflows/release-server.yaml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.create_release }}
      prerelease: ${{ inputs.prerelease }}
      publish_marketplace: ${{ inputs.publish_marketplace }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
