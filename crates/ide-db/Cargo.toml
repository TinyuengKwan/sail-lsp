[package]
name = "ide-db"
version = "0.1.0"
authors = ["sail-lsp contributors"]
edition = "2021"
license = "MIT"
publish = false

[lib]

[features]
default = []
test-utils = []

[dependencies]
tracing.workspace = true
stdx.workspace = true
base-db.workspace = true
vfs.workspace = true
salsa.workspace = true
parser.workspace = true
syntax.workspace = true
# ide-db should depend only on the top-level `hir` package, as in
# rust-analyzer. Anything from a `hir-xxx` subpackage is re-exported there.
hir = { workspace = true, default-features = false }
log.workspace = true
profile.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
url.workspace = true
serde_json.workspace = true
either.workspace = true
