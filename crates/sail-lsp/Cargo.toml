[package]
name = "sail-lsp"
version = "0.2.0"
authors = ["Tinyueng Kwan <kwantinyueng@gmail.com>"]
edition = "2021"
license = "MIT"

[features]
default = ["z3-solver"]
z3-solver = ["hir/z3-solver", "dep:z3"]
vendored = ["z3/vendored"]
[lib]
name = "sail_lsp"

[dependencies]
libc.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
fs2 = "0.4"
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
toml_edit = "0.22"
tempfile = "3.10"
anyhow.workspace = true
base-db.workspace = true
salsa.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
crossbeam-channel.workspace = true
walkdir.workspace = true
log.workspace = true
profile.workspace = true
parser.workspace = true
syntax.workspace = true
url.workspace = true
project-model.workspace = true
# Depends only on the top-level `hir` package, as in rust-analyzer.
# Anything from a `hir-xxx` subpackage is re-exported there.
hir = { workspace = true, default-features = false }
ide-db.workspace = true
ide.workspace = true
ide-assists.workspace = true
ide-diagnostics.workspace = true
stdx.workspace = true
vfs.workspace = true
vfs-notify.workspace = true
paths.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
z3 = { workspace = true, optional = true }
include_dir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true

[dev-dependencies]
ide-db = { workspace = true, features = ["test-utils"] }
ide = { workspace = true, features = ["test-utils"] }
