[package]
name = "ide"
version = "0.1.0"
authors = ["sail-lsp contributors"]
edition = "2021"
license = "MIT"
publish = false

[lib]

[dependencies]
base-db.workspace = true
salsa.workspace = true
parser.workspace = true
syntax.workspace = true
# ide should depend only on the top-level `hir` package. If you need
# something from a `hir-xxx` subpackage, re-export the API via `hir`.
hir = { workspace = true, default-features = false }
ide-db.workspace = true
ide-assists.workspace = true
ide-completion.workspace = true
ide-diagnostics.workspace = true
ide-ssr.workspace = true
rowan.workspace = true
serde_json.workspace = true
url.workspace = true
vfs.workspace = true
pulldown-cmark.workspace = true

[features]
# Exposes `ide::fixture` so other crates' tests can build an `Analysis` from a
# fixture string and run the real diagnostics pipeline over it.
test-utils = ["ide-db/test-utils"]

[dev-dependencies]
ide-db = { workspace = true, features = ["test-utils"] }
expect-test.workspace = true
rowan.workspace = true
