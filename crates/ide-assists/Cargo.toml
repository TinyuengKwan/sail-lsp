[package]
name = "ide-assists"
version = "0.1.0"
authors = ["sail-lsp contributors"]
edition = "2021"
license = "MIT"
publish = false

[lib]

[dependencies]
base-db.workspace = true
parser.workspace = true
syntax.workspace = true
# Depends only on the top-level `hir` package, as in rust-analyzer.
# Anything from a `hir-xxx` subpackage is re-exported there.
hir = { workspace = true, default-features = false }
salsa.workspace = true
ide-db.workspace = true
ide-diagnostics.workspace = true
url.workspace = true

[dev-dependencies]
expect-test.workspace = true
ide-db = { workspace = true, features = ["test-utils"] }

